name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Full-chapter Playwright scenarios. The scripts launch Edge (channel
  # "msedge"), which Playwright can install on Ubuntu; WebGL renders through
  # SwiftShader so frame rate is low but behaviour is deterministic.
  browser:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        suite: [browser, ground, handover, cave, rooftop]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps msedge
      - run: npm run build
      - name: Serve the production build
        run: npx vite preview --port 4173 --strictPort &
      - run: npx wait-on -t 30000 http://localhost:4173
      - run: node tests/${{ matrix.suite }}.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-screenshots-${{ matrix.suite }}
          path: verification/*.png
          if-no-files-found: ignore
